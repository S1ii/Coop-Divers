name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository hygiene
        shell: pwsh
        run: .\build\verify-repo.ps1

  build:
    if: ${{ vars.REFERENCE_REPOSITORY != '' }}
    needs: hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Fetch private game references
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REFERENCE_REPOSITORY }}
          token: ${{ secrets.REFERENCE_REPOSITORY_TOKEN }}
          path: game-references
      - name: Build
        shell: pwsh
        run: dotnet build .\DaveTheDiverMP.csproj -c Release -p:GameInstallPath="$env:GITHUB_WORKSPACE\game-references" -p:DeployPlugin=false
      - name: Package
        shell: pwsh
        run: .\build\package.ps1 -Configuration Release
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DaveTheDiverMP
          path: artifacts/*.zip
