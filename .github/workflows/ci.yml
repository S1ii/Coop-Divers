name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository hygiene
        shell: pwsh
        run: .\build\verify-repo.ps1

  build:
    name: Build and package
    if: ${{ vars.REFERENCE_REPOSITORY != '' }}
    needs: hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check reference configuration
        shell: pwsh
        env:
          REFERENCE_REPOSITORY_TOKEN: ${{ secrets.REFERENCE_REPOSITORY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REFERENCE_REPOSITORY_TOKEN)) {
            throw 'Repository secret REFERENCE_REPOSITORY_TOKEN is required when REFERENCE_REPOSITORY is set.'
          }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.x
      - name: Fetch private game references
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.REFERENCE_REPOSITORY }}
          token: ${{ secrets.REFERENCE_REPOSITORY_TOKEN }}
          path: game-references
      - name: Restore
        shell: pwsh
        run: dotnet restore .\DaveTheDiverMP.csproj
      - name: Build
        shell: pwsh
        run: dotnet build .\DaveTheDiverMP.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:GameInstallPath="$env:GITHUB_WORKSPACE\game-references" -p:DeployPlugin=false
      - name: Package
        shell: pwsh
        run: .\build\package.ps1 -Configuration Release
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: DaveTheDiverMP
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  reference-configuration:
    name: Reference configuration
    if: ${{ vars.REFERENCE_REPOSITORY == '' }}
    needs: hygiene
    runs-on: windows-latest
    steps:
      - name: Explain skipped build
        shell: pwsh
        run: |
          Write-Host 'Build/package skipped: set repository variable REFERENCE_REPOSITORY and secret REFERENCE_REPOSITORY_TOKEN to enable CI builds.'
