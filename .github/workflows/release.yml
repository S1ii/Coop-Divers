name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag to promote
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: Promote prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Promote GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          is_prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)
          if [ "$is_prerelease" != true ]; then
            echo "Release $RELEASE_TAG is not a prerelease." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --prerelease=false --latest
